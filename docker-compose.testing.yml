services:
  app:
    build:
      context: .
    environment:
      # Strictly isolated testing environment
      APP_ENV: testing
      APP_DEBUG: "true"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rewardstack_test
      DB_USERNAME: rewardstack
      DB_PASSWORD: rewardstack

      # Keep tests deterministic and safe (no background workers / external mail)
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array

      # Always test keys only
      STRIPE_KEY: pk_test_fake
      STRIPE_SECRET: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_test_fake
      STRIPE_CONNECT_ENABLED: "false"

      # Prevent accidental external HTTP calls from "real" keys
      PRINTFUL_API_KEY: test_key
      SENDGRID_API_KEY: test_key

    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rewardstack_test
      MYSQL_USER: rewardstack
      MYSQL_PASSWORD: rewardstack
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_test_data:/var/lib/mysql

  redis:
    image: redis:7-alpine

volumes:
  db_test_data:


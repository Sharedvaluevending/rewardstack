# Priority queue workers (recommended)
#
# - high: webhooks, payments, critical ops
# - default: normal background work
# - low: analytics aggregation, reporting

[program:rewardstack-worker-high]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/rewardstack-app/current
command=/usr/bin/php artisan queue:work redis --queue=${QUEUE_HIGH:-high} --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/rewardstack-app/shared/storage/logs/worker-high.log
stopwaitsecs=3600

[program:rewardstack-worker-default]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/rewardstack-app/current
command=/usr/bin/php artisan queue:work redis --queue=${QUEUE_DEFAULT:-default} --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/rewardstack-app/shared/storage/logs/worker-default.log
stopwaitsecs=3600

[program:rewardstack-worker-low]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/rewardstack-app/current
command=/usr/bin/php artisan queue:work redis --queue=${QUEUE_LOW:-low} --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/rewardstack-app/shared/storage/logs/worker-low.log
stopwaitsecs=3600

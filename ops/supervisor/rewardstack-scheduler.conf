[program:rewardstack-scheduler]
directory=/var/www/rewardstack-app/current
command=/bin/sh -lc 'while true; do /usr/bin/php artisan schedule:run --no-interaction; sleep 60; done'
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/rewardstack-app/shared/storage/logs/scheduler.log
